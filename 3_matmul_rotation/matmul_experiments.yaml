experiment: matmul

profilers:
  ncu:
    replay-mode: kernel
    profiler-set: detailed
    sections: []
    args: []
  nsys:
    trace: cuda,nvtx,osrt
    sample: none
    args: []

sweeps:
  - variant: matmul-naive
    label: small
    args:
      m: 512
      n: 512
      k: 512

  - variant: matmul-shared
    label: small
    args:
      m: 512
      n: 512
      k: 512

  - variant: transpose-naive
    label: medium
    args:
      m: 1024
      n: 1024
      k: 1024

  - variant: transpose-padded
    label: medium
    args:
      m: 1024
      n: 1024
      k: 1024
