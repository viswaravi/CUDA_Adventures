experiment: rotation

profilers:
  ncu:
    replay-mode: application
    profiler-set: detailed
    sections: []
    args: []
  nsys:
    trace: cuda,nvtx,osrt
    sample: none
    args: []

sweeps:
  - variant: rotation-naive
    label: a45
    args:
      image: res/cuda.png
      angle: 45

  - variant: rotation-bbox-coop
    label: a45
    args:
      image: res/cuda.png
      angle: 45

  - variant: rotation-bbox-strided
    label: a45
    args:
      image: res/cuda.png
      angle: 45

  - variant: texture-interpolation
    label: baseline
    args:
      image: res/cuda.png
